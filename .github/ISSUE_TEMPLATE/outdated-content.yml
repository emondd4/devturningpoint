name: Outdated content
description: Flag content that needs re-verification
title: "[outdated] "
labels: ["content", "needs-review"]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
    validations:
      required: true
  - type: input
    id: last-verified
    attributes:
      label: Shown lastVerified date
  - type: textarea
    id: why
    attributes:
      label: Why is it outdated?
    validations:
      required: true
